name: Source checks (manual or PR)
on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  public-quality:
    name: public-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Product, privacy and distribution integrity
        run: python -B scripts/check_public.py
  source-tests:
    name: source-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source tests
        run: python -m unittest discover -s tests -v
      - name: Public distribution neutrality and privacy
        run: python -m muse_presets.cli audit-neutrality
      - name: Doctor
        run: python -B -m muse_presets.cli doctor
      - name: Verify all eleven source kits
        run: python -B examples/github_quickstart.py --all
  checks:
    name: checks
    if: ${{ always() }}
    needs: [source-tests, public-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require every platform and product-quality job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -B scripts/check_ci_results.py
